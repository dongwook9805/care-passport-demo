<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>녹산 진료 기록</title>
<style>
/* Layout: patient list on the left, one patient's chart on the right; stacks on narrow screens.
   System fonts only so it works offline on old clinic PCs. */
:root {
  --bg: #F3F6F5; --surface: #FFFFFF; --fg: #15242A; --muted: #5A6A6E; --line: #D3DCDA;
  --accent: #0C6A63; --accent-soft: #E0EFEB; --on-accent: #FFFFFF;
  --danger: #A23A2E; --danger-soft: #F8E5E1; --warn: #7A5600; --warn-soft: #F7ECCF;
  --sans: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif;
  --mono: ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F181B; --surface: #172428; --fg: #E4EDEB; --muted: #9AAEAD; --line: #2C3E43;
    --accent: #5CC4B6; --accent-soft: #163631; --on-accent: #0F181B;
    --danger: #F0A396; --danger-soft: #3C2220; --warn: #E5C46B; --warn-soft: #393013;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
h1, h2, h3, p { margin: 0; }
h2 { font-size: 22px; line-height: 1.35; }
h3 { font-size: 15px; font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.brand h1 { font-size: 18px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.status { font-size: 13px; color: var(--muted); }
.status.bad { color: var(--danger); font-weight: 600; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; line-height: 1.4; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 3px 9px; font-size: 13px; }
.btn:disabled, a.btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
a.btn { text-decoration: none; color: inherit; display: inline-block; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 56px); }
aside { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-width: 0; }
.side-head { padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.side-head input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.plist { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
.plist button { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 12px; display: grid; gap: 2px; }
.plist button:hover { background: var(--bg); }
.plist button[aria-current="true"] { background: var(--accent-soft); }
.pl-top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.pl-name { font-weight: 600; }
.empty-list { padding: 16px 12px; color: var(--muted); }

main { padding: 20px max(16px, 3vw) 48px; min-width: 0; display: grid; gap: 20px; align-content: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.chip { display: inline-block; border-radius: 4px; padding: 0 8px; font-size: 13px; font-weight: 600; line-height: 1.7; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.plain { background: var(--bg); color: var(--muted); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.confirm { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 12px 14px; border-radius: 8px; background: var(--danger-soft); color: var(--danger); font-weight: 600; }
.flash { padding: 10px 14px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.flash.bad { background: var(--danger-soft); color: var(--danger); }

.phead { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start; }
.phead .who { display: grid; gap: 2px; min-width: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.alerts { border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; }
.alerts.has { background: var(--danger-soft); }
.alerts.none { background: var(--accent-soft); }
.alerts.unknown { background: var(--warn-soft); }
.alerts .label { font-size: 13px; font-weight: 700; }
.handoff { border-left: 4px solid var(--accent); background: var(--surface); padding: 12px 14px; border-radius: 0 8px 8px 0; display: grid; gap: 4px; }
.two { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; }

.teeth { display: grid; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.trow { display: flex; gap: 3px; align-items: center; }
.trow .mid { width: 10px; align-self: stretch; border-left: 2px solid var(--line); margin-left: 6px; }
.tooth { width: 34px; height: 34px; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); font-family: var(--mono); font-size: 13px; padding: 0; }
.tooth.has { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.tooth.sel { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.tooth.focus { outline: 2px solid var(--fg); outline-offset: 1px; }
.orient { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); max-width: 590px; }

.visits { display: grid; gap: 12px; }
.visit { display: grid; gap: 8px; }
.visit-head { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; align-items: baseline; }
.vdate { font-family: var(--mono); font-weight: 700; font-size: 16px; }
.kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 12px; }
.kv dt { color: var(--muted); font-size: 13px; padding-top: 1px; }
.kv dd { margin: 0; white-space: pre-wrap; }

.form { display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .field .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.field textarea { min-height: 70px; resize: vertical; }
.req { color: var(--danger); }
.toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 14px; }
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.toggle.risk[aria-pressed="true"] { background: var(--danger); border-color: var(--danger); }
.items { display: grid; gap: 6px; }
.item { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
.item .grow { flex: 1 1 160px; min-width: 0; }
.adder { display: grid; gap: 10px; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; }

.guide { display: grid; gap: 8px; padding-left: 20px; margin: 0; }

.explain { max-width: 640px; background: #FFFFFF; color: #15242A; border: 1px solid var(--line); border-radius: 8px; padding: 24px; display: grid; gap: 16px; }
.explain .muted { color: #5A6A6E; }
.explain h2 { font-size: 24px; }
.ex-item { display: grid; gap: 2px; padding: 10px 0; border-top: 1px solid #D3DCDA; }
.ex-item .ko { font-size: 13px; color: #5A6A6E; }
.ex-box { background: #F8E5E1; color: #6E241B; border-radius: 6px; padding: 10px 12px; }
.ex-raw { background: #F3F6F5; border-radius: 6px; padding: 10px 12px; white-space: pre-wrap; }
.ex-foot { font-size: 12px; color: #5A6A6E; }

@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  .plist { max-height: 40vh; }
  .two { grid-template-columns: minmax(0, 1fr); }
}
@media print {
  .top, aside, .no-print { display: none !important; }
  .layout { display: block; }
  main { padding: 0; }
  body { background: #FFFFFF; }
  .explain { border: 0; max-width: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>녹산 진료 기록</h1>
    <span class="chip warn">시제품 · 이 기기에만 저장 · 가상 환자로 시연</span>
  </div>
  <div class="tools">
    <span id="status" class="status"></span>
    <button class="btn sm" data-act="export">백업 파일 저장</button>
    <button class="btn sm" data-act="import">백업 불러오기</button>
    <button class="btn sm" data-act="add-samples">가상 환자 넣기</button>
    <button class="btn sm danger" data-act="ask-wipe">전부 지우기</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="side-head">
      <input id="q" type="search" placeholder="차트 번호·이름 검색" autocomplete="off">
      <button class="btn primary" data-act="new-patient">새 환자 등록</button>
    </div>
    <ul id="plist" class="plist"></ul>
  </aside>
  <main id="main"></main>
</div>

<!-- QR 라이브러리: prototype/web/demo/js/vendor/qrcode.js 를 그대로 넣음 (Kazuhiko Arase, MIT). 인터넷 없이 QR을 그리기 위해 -->
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';

  function viewPassport(p) {
    var lang = st.ppLang || p.lang || 'en';

      '<p>환자가 가져가는 카드입니다. 카드에는 주의사항과 치료 기록이 환자 언어와 영어로 들어가고, QR에는 전체 기록이 들어갑니다. 다른 병원 의사가 QR을 찍으면 영어(한국어 전환 가능) 화면이 열립니다.</p>' +
      '<ol class="guide"><li>환자 폰으로 아래 카드 이미지를 찍게 하거나, <b>카드 이미지 저장</b>으로 파일을 만들어 메신저로 보냅니다.</li>' +

  var ppToken = 0;
  function fillPassport(p) {
    var token = ++ppToken, lang = st.ppLang || p.lang || 'en';
    buildPassportLink(p).then(function (res) {
      if (token !== ppToken || st.view !== 'passport') return;
      var canvas = drawPassportCard(p, lang, res.url);
      st.ppCanvas = canvas; st.ppUrl = res.url;
      var out = $('ppOut');
      out.innerHTML = '<img alt="의료 여권 카드" style="width:100%;max-width:540px;border:1px solid var(--line);border-radius:8px;background:#fff">';
      out.firstChild.src = canvas.toDataURL('image/png');
      $('ppLink').value = res.url;
      var a = $('ppOpen'); a.href = res.url; a.removeAttribute('aria-disabled');
      document.querySelectorAll('[data-act="pp-save"],[data-act="pp-copy"]').forEach(function (b) { b.disabled = false; });
      $('ppNote').textContent = 'QR 링크 ' + res.url.length + '자' + (res.dropped ? ' · 길이 때문에 오래된 치료 ' + res.dropped + '줄은 QR에서 뺐습니다' : '');
    }).catch(function (e) {
      if (token !== ppToken) return;
      $('ppOut').innerHTML = '<div class="flash bad">카드를 만들지 못했습니다: ' + esc(e.message) + '</div>';
    });
  }

  function savePassportImage() {
    var p = patient(st.sel);
    if (!st.ppCanvas || !p) return;
    st.ppCanvas.toBlob(function (blob) {
      if (!blob) { flash('이미지를 만들지 못했습니다. 화면의 카드를 캡처하세요.', true); render(); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'K-CARE-LINK-' + (p.chartNo || 'passport') + '.png';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }, 'image/png');
  }

  function copyPassportLink() {
    var input = $('ppLink');
    function fallback() { input.focus(); input.select(); $('ppNote').textContent = '링크를 선택했습니다. Ctrl+C(맥은 ⌘+C)로 복사하세요.'; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(st.ppUrl).then(function () { $('ppNote').textContent = 'QR 링크를 복사했습니다.'; }, fallback);
    } else fallback();

  function render() {
    renderList();
    renderStatus();
    var p = st.sel ? patient(st.sel) : null;
    if ((st.view === 'patient' || st.view === 'visitForm' || st.view === 'explain' || st.view === 'passport') && !p) st.view = 'home';
    var html;
    if (st.view === 'patient') html = viewPatient(p);
    else if (st.view === 'patientForm') html = viewPatientForm();
    else if (st.view === 'visitForm') html = viewVisitForm(p);
    else if (st.view === 'explain') html = viewExplain(p);
    else if (st.view === 'passport') html = viewPassport(p);
    else html = viewHome();
    main.innerHTML = html;
    if (st.view === 'passport') fillPassport(p);
  }

  function go(view, keepFlash) {
    st.view = view; st.confirm = null;
    if (!keepFlash) st.flash = null;
    render();
    main.scrollTop = 0; window.scrollTo(0, 0);
  }
  function flash(text, bad) { st.flash = { text: text, bad: !!bad }; }

  /* ---------- 동작 ---------- */
  function startPatientForm(p) {
    st.draft = p ? clone(p) : { chartNo: '', name: st.q.trim(), nameAlt: '', birthYear: '', sex: '', nationality: '', lang: 'ru', alerts: [], noneConfirmed: false, alertNote: '', memo: '', visits: [] };
    if (!p) st.sel = null;
    go('patientForm');
  }
  function startVisitForm(v) {
    st.draft = v ? clone(v) : { date: today(), provider: '', recorder: '', complaint: '', items: [], comment: '', nextPlan: '' };
    st.teethSel = []; st.itemCode = 'exam'; st.itemNote = '';
    go('visitForm');
  }

  function savePatient() {
    var d = st.draft;
    d.chartNo = (d.chartNo || '').trim(); d.name = (d.name || '').trim();
    if (!d.chartNo || !d.name) { flash('차트 번호와 이름은 꼭 적어야 합니다.', true); render(); return; }
    var dup = db.patients.filter(function (x) { return x.chartNo === d.chartNo && x.id !== d.id; })[0];
    if (dup) { flash('차트 번호 ' + d.chartNo + '는 이미 ' + dup.name + ' 환자에게 쓰였습니다. 번호를 확인하세요.', true); render(); return; }
    if (d.alerts.length) d.noneConfirmed = false;
    if (d.id) {
      var i = db.patients.indexOf(patient(d.id));
      d.visits = db.patients[i].visits;
      db.patients[i] = d;
    } else {
      d.id = uid(); d.createdAt = new Date().toISOString();
      db.patients.push(d);
    }
    save();
    st.sel = d.id; st.draft = null; st.toothFocus = null;
    flash('저장했습니다.');
    go('patient', true);
  }

  function saveVisit() {
    var p = patient(st.sel), d = st.draft;
    if (!d.date) { flash('진료일을 넣어 주세요.', true); render(); return; }
    if (!d.items.length && !d.comment && !d.nextPlan) { flash('치료 항목, 코멘트, 다음 진료자에게 남길 말 중 하나는 있어야 합니다.', true); render(); return; }
    if (d.id) {
      for (var i = 0; i < p.visits.length; i++) if (p.visits[i].id === d.id) p.visits[i] = d;
    } else {
      d.id = uid(); d.createdAt = new Date().toISOString();
      p.visits.push(d);
    }
    save();
    st.draft = null;
    flash('진료 기록을 저장했습니다.');
    go('patient', true);
  }

  function exportData() {
    try {
      var blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'noksan-backup-' + today() + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      flash('백업 파일을 저장했습니다. 다운로드 폴더를 확인하세요.');
    } catch (e) { flash('백업 파일을 만들지 못했습니다: ' + e.message, true); }
    render();
  }

  var pendingImport = null;
  $('importFile').addEventListener('change', function (e) {
    var file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.patients)) throw new Error('환자 목록이 없습니다');
        d.patients.forEach(function (p) { if (!p.id || !p.chartNo || !Array.isArray(p.visits) || !Array.isArray(p.alerts)) throw new Error('형식이 맞지 않는 환자가 있습니다'); });
        pendingImport = d;
        st.confirm = { text: '백업 파일의 환자 ' + d.patients.length + '명으로 지금 기록(' + db.patients.length + '명)을 바꿉니다. 지금 기록은 사라집니다.', yes: '바꾸기', act: 'import' };
      } catch (err) { flash('불러오지 못했습니다. 이 프로그램에서 저장한 백업 파일인지 확인하세요. (' + err.message + ')', true); }
      render();
    };
    r.readAsText(file);
  });

  function doConfirm() {
    var c = st.confirm; st.confirm = null;
    if (!c) return;
    if (c.act === 'wipe') { db = { version: 1, patients: [] }; save(); st.sel = null; flash('모든 기록을 지웠습니다.'); go('home', true); return; }
    if (c.act === 'import') { db = pendingImport; pendingImport = null; save(); st.sel = null; flash('백업 파일을 불러왔습니다.'); go('home', true); return; }
    if (c.act === 'del-patient') {
      db.patients = db.patients.filter(function (x) { return x.id !== st.sel; });
      save(); st.sel = null; flash('환자를 삭제했습니다.'); go('home', true); return;
    }
    if (c.act === 'del-visit') {
      var p = patient(st.sel);
      p.visits = p.visits.filter(function (v) { return v.id !== c.id; });
      save(); flash('진료 기록을 삭제했습니다.'); render(); return;
    }
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t || t.tagName === 'SELECT') return;
    var act = t.getAttribute('data-act');
    var p = st.sel ? patient(st.sel) : null;
    switch (act) {
      case 'open': st.sel = t.getAttribute('data-id'); st.toothFocus = null; go('patient'); break;
      case 'new-patient': startPatientForm(null); break;
      case 'edit-patient': startPatientForm(p); break;
      case 'new-visit': startVisitForm(null); break;
      case 'edit-visit': p.visits.forEach(function (v) { if (v.id === t.getAttribute('data-id')) startVisitForm(v); }); break;
      case 'cancel': case 'back': st.draft = null; go(st.sel ? 'patient' : 'home'); break;
      case 'save-patient': savePatient(); break;
      case 'save-visit': saveVisit(); break;
      case 'explain': st.exLang = p.lang || 'en'; st.exVisit = null; go('explain'); break;
      case 'print': window.print(); break;
      case 'passport': st.ppLang = p.lang || 'en'; st.ppCanvas = null; st.ppUrl = ''; go('passport'); break;
      case 'pp-save': savePassportImage(); break;
      case 'pp-copy': copyPassportLink(); break;
      case 'alert': {
        var code = t.getAttribute('data-code'), a = st.draft.alerts, i = a.indexOf(code);
        if (i >= 0) a.splice(i, 1); else a.push(code);
        render(); break;
      }
      case 'tooth': {
        var n = +t.getAttribute('data-n');
        if (st.view === 'visitForm') {
          var k = st.teethSel.indexOf(n);
          if (k >= 0) st.teethSel.splice(k, 1); else st.teethSel.push(n);
        } else {
          st.toothFocus = st.toothFocus === n ? null : n;
        }
        render(); break;
      }
      case 'pick-treat': st.itemCode = t.getAttribute('data-code'); render(); break;
      case 'add-item':
        st.draft.items.push({ code: st.itemCode, teeth: st.teethSel.slice().sort(function (a, b) { return a - b; }), note: st.itemNote.trim() });
        st.teethSel = []; st.itemNote = ''; render(); break;
      case 'del-item': st.draft.items.splice(+t.getAttribute('data-i'), 1); render(); break;
      case 'export': exportData(); break;
      case 'import': $('importFile').click(); break;
      case 'add-samples': {
        var added = 0;
        samples().forEach(function (s) {
          if (!db.patients.some(function (x) { return x.chartNo === s.chartNo; })) { db.patients.push(s); added++; }
        });
        save();
        flash(added ? '가상 환자 ' + added + '명을 넣었습니다.' : '가상 환자가 이미 모두 있습니다.');
        render(); break;
      }
      case 'ask-wipe': st.confirm = { text: '이 기기의 환자 ' + db.patients.length + '명과 진료 기록을 모두 지웁니다. 먼저 백업 파일을 저장했는지 확인하세요.', yes: '모두 지우기', act: 'wipe' }; st.flash = null; render(); window.scrollTo(0, 0); break;
      case 'ask-del-patient': st.confirm = { text: p.chartNo + ' ' + p.name + ' 환자와 진료 기록 ' + p.visits.length + '건을 삭제합니다.', yes: '삭제', act: 'del-patient' }; st.flash = null; render(); window.scrollTo(0, 0); break;
      case 'ask-del-visit': st.confirm = { text: '이 진료 기록을 삭제합니다.', yes: '삭제', act: 'del-visit', id: t.getAttribute('data-id') }; st.flash = null; render(); window.scrollTo(0, 0); break;
      case 'confirm-yes': doConfirm(); break;
      case 'confirm-no': st.confirm = null; pendingImport = null; render(); break;
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'q') { st.q = t.value; renderList(); return; }
    if (t.id === 'itemNote') { st.itemNote = t.value; return; }
    var f = t.getAttribute && t.getAttribute('data-f');
    if (f && st.draft) st.draft[f] = t.type === 'checkbox' ? t.checked : t.value;
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    var f = t.getAttribute && t.getAttribute('data-f');
    if (f && st.draft) st.draft[f] = t.type === 'checkbox' ? t.checked : t.value;
    if (t.id === 'exLang') { st.exLang = t.value; render(); }
    if (t.id === 'exVisit') { st.exVisit = t.value; render(); }
    if (t.id === 'ppLang') { st.ppLang = t.value; render(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.id === 'itemNote' && e.key === 'Enter') { e.preventDefault(); var b = document.querySelector('[data-act="add-item"]'); if (b) b.click(); }
  });

  render();
})();
</script>
</body>
</html>
